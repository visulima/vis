[package]
name = "task-runner-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The native addon lives at the workspace root; the engines are the `task-runner-core`
# crate (no napi). `default-members` keeps plain `cargo test` / `cargo clippy` /
# `cargo bench` in this directory covering both. The fspy_* crates are separate
# packages (own lockfile; the injected dylib/DLL must never be linked into the addon),
# so they are excluded from the workspace. `fspy_wire` (the wire format they share
# with this crate) has no dependencies and is a member, so plain `cargo test` runs its tests.
[workspace]
members = ["core", "fspy_wire"]
default-members = [".", "core", "fspy_wire"]
exclude = ["fspy_macos", "fspy_seccomp", "fspy_windows"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async"] }
napi-derive = "3"
task-runner-core = { path = "core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# Linux file-access tracker via seccomp_unotify. Pure Rust, no
# system libraries — fspy_seccomp talks to the kernel directly via
# raw `seccomp(2)` + ioctl. Works on every Linux target (gnu, musl,
# aarch64, riscv64) with no C dependency.
[target.'cfg(target_os = "linux")'.dependencies]
fspy-seccomp = { path = "./fspy_seccomp" }

# macOS interpose tracker (native/src/macos.rs) talks to libc directly for the
# socketpair + datagram recv + fd flags. The injected dylib lives in the
# separate `fspy_macos` cdylib (NOT a dependency here — its `__interpose`
# section must never link into the parent addon).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.178"

# Wire format shared with the injected dylib/DLL (opcodes, message framing, names).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
fspy-wire = { path = "./fspy_wire" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  # Windows file-access tracker parent (native/src/windows.rs): suspended
  # process creation + CreateRemoteThread(LoadLibraryW) DLL injection + a
  # per-spawn named-pipe server that drains the injected fspy_windows DLL.
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[build-dependencies]
napi-build = "2"

# Max-opt release profile, governing the shipped addon AND the sidecar
# binaries built under this workspace (see the fspy_seccomp note above).
# Fat LTO is a measured decision, not a copied default: on rustc 1.99
# (2026-10), interleaved criterion A/B/A/B runs showed `lto = "thin"`
# regressing the hot paths — graph/get_transitive_deps ~+5%,
# graph/find_all_cycles ~+3%, file_hasher/64K ~+3% — while saving no build
# time (24s cold-build either way; the relink phase alone is 6s vs 5s).
# Thin LTO only pays off when a dep tree makes fat-LTO links minutes long;
# this tree doesn't. Re-measure (cargo bench --profile release) before
# changing this.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "unwind"
