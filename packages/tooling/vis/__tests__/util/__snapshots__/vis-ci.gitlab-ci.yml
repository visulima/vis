# Generated by `vis sync ci-workflow`. Do not edit by hand: change `ci.workflow` in vis.config.ts and re-run it.
#
# Include it from .gitlab-ci.yml:
#   include:
#     - local: ".gitlab/vis-ci.gitlab-ci.yml"
#
# Every target is its own job, so jobs in a group run on separate machines at
# the same time; a partitioned target fans out with `parallel: N`.
.vis-ci-base:
    stage: "test"
    image: "node:22"
    timeout: "60m"
    variables:
        # Full history, so affected detection can diff against the base.
        GIT_DEPTH: "0"
        # Outside node_modules, so a clean install (npm ci) keeps the restored task cache.
        VIS_CACHE_DIRECTORY: "$CI_PROJECT_DIR/.vis-cache"
    cache:
        # Per job: jobs of one group finish in any order, and a shared key keeps only the last upload.
        key: "vis-$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG"
        paths:
            - ".vis-cache/"
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH == "main"'
    before_script:
        - "npm install -g corepack"
        - "corepack enable"
        - "pnpm install --frozen-lockfile"

"vis:workflow":
    extends: ".vis-ci-base"
    needs: []
    script:
        - "pnpm exec vis sync ci-workflow --check"

"vis:lint":
    extends: ".vis-ci-base"
    needs: []
    script:
        - "pnpm exec vis ci lint --no-install --if-present"

"vis:build":
    extends: ".vis-ci-base"
    needs: []
    script:
        - "pnpm exec vis ci build --no-install --if-present"

"vis:test":
    extends: ".vis-ci-base"
    needs: ["vis:lint", "vis:build"]
    parallel: 3
    script:
        - "pnpm exec vis ci test --no-install --partition=$CI_NODE_INDEX/$CI_NODE_TOTAL --if-present"
