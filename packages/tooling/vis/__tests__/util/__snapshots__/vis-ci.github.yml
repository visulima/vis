# Generated by `vis sync ci-workflow`. Do not edit by hand: change `ci.workflow` in vis.config.ts and re-run it.
name: "vis ci"

on: # yamllint disable-line rule:truthy
    pull_request:
    push:
        branches:
            - "main"

permissions:
    contents: "read"

concurrency:
    group: "vis-ci-${{ github.ref }}"
    # Supersede outdated pull request runs, but let every push to a branch finish.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        name: "vis ci"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        steps:
            # Full history, so affected detection can diff against the base.
            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup pnpm"
              uses: "pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115" # v6.1.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  node-version: "22"
                  cache: "pnpm"

            - name: "Install dependencies"
              run: "pnpm install --frozen-lockfile"

            # The vis task cache, so unchanged tasks are restored instead of re-run.
            - name: "Restore vis cache"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  key: "vis-${{ runner.os }}-${{ github.sha }}"
                  path: "node_modules/.cache/vis"
                  restore-keys: |
                      vis-${{ runner.os }}-

            # Fails when vis.config.ts or the workspace changed without regenerating this file.
            - name: "Check the workflow is up to date"
              run: "pnpm exec vis sync ci-workflow --check"

            # Builds what the targets below depend on once, so the parallel steps
            # never build or restore the same outputs at the same time.
            - name: "Build dependencies"
              run: |
                  pnpm exec vis ci lint --no-install --deps-only --if-present
                  pnpm exec vis ci build --no-install --deps-only --if-present
                  pnpm exec vis ci test --no-install --deps-only --if-present

            - parallel:
                  - name: "lint"
                    run: "pnpm exec vis ci lint --no-install --skip-deps --if-present"
                  - name: "build"
                    run: "pnpm exec vis ci build --no-install --skip-deps --if-present"

            - parallel:
                  - name: "test (1/2)"
                    run: "pnpm exec vis ci test --no-install --skip-deps --partition=1/2 --if-present"
                  - name: "test (2/2)"
                    run: "pnpm exec vis ci test --no-install --skip-deps --partition=2/2 --if-present"
