# The native `vis` CLI front-end — the Rust migration's startup + dispatch shell.
#
# A deliberately lean crate: it depends on `vis-core` (pure pm logic) plus the small
# set needed by the `hook run` fast path (regex, prek-identify, serde_json), never
# on the `vis-native` addon, so `cargo build -p vis-cli` stays fast and free of
# the addon's heavy, toolchain-sensitive deps (rusqlite, …). The one exception is
# the oxc parser, which reads `vis.config.*` files as data without running them.
# Shared logic ported off Node lives in `vis-core`.
#
# Profiles ([profile.release] etc.) are inherited from the workspace root
# (../Cargo.toml).
[package]
name = "vis-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "vis"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
# `localtime_r` for the local clock in pail's header (see src/clean.rs).
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Only read when `NODE_EXTRA_CA_CERTS` or `SSL_CERT_FILE` is set (see src/http/tls.rs): the OS trust store
# that the extra PEM file is added to, like Node does. Not on macOS, where it would link the Security framework.
rustls-native-certs = "0.8"

[target.'cfg(windows)'.dependencies]
# Switches the console to ANSI mode at startup (see src/term.rs).
windows-sys = { version = "0.61", features = [ "Win32_System_Console" ] }

[dependencies]
vis-core = { path = "../core" }
# The pure task-runner engines (no napi). `cache hash` reads the main worktree root through it, so
# the shared cache directory resolves exactly like the Node path, which calls the same function.
task-runner-core = { path = "../../../task-runner/native/core" }
# `run`: the tasks of a fully cached run are keyed and looked up on every core.
rayon = "1"
# `hook run` fast path. `prek-identify` is pinned to the addon's version so both
# classify files identically. The fast path compiles every pattern with `unicode(false)`
# (see src/hook/filter.rs), so ASCII semantics match JS `RegExp` whichever regex features
# the scanner engine below unifies in (it needs the Unicode tables).
prek-identify = "0.5"
regex = { version = "1", default-features = false, features = [
  "std",
  "perf"
] }
# `vis sort-package-json`: the same sorter crate the addon runs for the Node command, so both order a file
# identically (it adds no package to the lockfile: serde and serde_json are already there).
sort-package-json = "1"
# Content digests for the evaluated-config cache (src/config_cache.rs); the addon pins the same major.
blake3 = { version = "1", default-features = false }
# `vis secrets`: the scanner engine itself, linked as a plain crate (no napi, no addon), and the
# SHA-256 of its baseline fingerprints. Everything in the engine's tree is pure Rust.
secret-scanner-core = { path = "../../../secret-scanner/native/core" }
sha2 = "0.10"
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [
  "float_roundtrip",
  "raw_value"
] }
# Reads `vis.config.*` as data (see src/vis_config.rs). Pinned like the addon's copies.
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"
# Terminal width for help layout (the tty size, like the Node CLI's own lookup).
terminal_size = "0.4"
# `src/http/`: the blocking HTTPS client (rustls + ring + the bundled Mozilla roots, gzip). Default features
# are off so no second TLS stack or unused codec links; it is built lazily and never touched by `--version`.
ureq = { version = "3.5", default-features = false, features = [ "rustls", "gzip" ] }
# Already in the tree through `ureq`; named here to read its errors apart (src/http/error.rs) and, in the tests, to
# serve TLS. Same features as `ureq` turns on.
rustls = { version = "0.23", default-features = false, features = [ "ring", "std" ] }

[dev-dependencies]
# A self-signed certificate generated at test time, and a TLS server to present it, so the extra-CA path
# is proven without a network (src/http/tests.rs).
rcgen = { version = "0.13", default-features = false, features = [ "crypto", "pem", "ring" ] }
