# The native `vis` CLI front-end — the Rust migration's startup + dispatch shell.
#
# A deliberately lean crate: it depends on `vis-core` (pure pm logic) plus the small
# set needed by the `hook run` fast path (regex, prek-identify, serde_json), never
# on the `vis-native` addon, so `cargo build -p vis-cli` stays fast and free of
# the addon's heavy, toolchain-sensitive deps (rusqlite, …). The one exception is
# the oxc parser, which reads `vis.config.*` files as data without running them.
# Shared logic ported off Node lives in `vis-core`.
#
# Profiles ([profile.release] etc.) are inherited from the workspace root
# (../Cargo.toml).
[package]
name = "vis-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "vis"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
# `localtime_r` for the local clock in pail's header (see src/clean.rs).
libc = "0.2"

[dependencies]
vis-core = { path = "../core" }
# `hook run` fast path. `prek-identify` is pinned to the addon's version so both
# classify files identically; `regex` is built without Unicode tables because the
# fast path only accepts patterns whose ASCII semantics match JS `RegExp`.
prek-identify = "0.5"
regex = { version = "1", default-features = false, features = [
  "std",
  "perf"
] }
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "float_roundtrip" ] }
# Reads `vis.config.*` as data (see src/vis_config.rs). Pinned like the addon's copies.
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"
# Terminal width for help layout (the tty size, like the Node CLI's own lookup).
terminal_size = "0.4"
