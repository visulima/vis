# Shared pure logic for the vis native front-end: package-manager detection and
# command resolution. The `vis` CLI binary depends on this crate directly, and
# the `vis-native` napi addon wraps it (`src/pm_detect.rs`, `src/pm_resolve.rs`),
# so there is one implementation of each.
#
# Pure std + serde_json (+ the dependency-free ec4rs) only — no napi, so the lean CLI build stays fast.
[package]
name = "vis-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = [ "rlib" ]

[dependencies]
serde_json = "1"
# `.editorconfig` lookup shared by the addon and the CLI, so both resolve the same indent and line ending.
ec4rs = "1"

# Proves the engine crates of the other native packages link into the CLI's
# napi-free dependency graph (see tests/engines.rs). Dev-only: the `vis` binary does
# not depend on them yet.
[dev-dependencies]
secret-scanner-core = { path = "../../../secret-scanner/native/core" }
task-runner-core = { path = "../../../task-runner/native/core" }
