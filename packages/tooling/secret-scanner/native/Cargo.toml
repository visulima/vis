[package]
name = "secret-scanner-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The native addon lives at the workspace root; the scanner engine is the
# `secret-scanner-core` crate (no napi), so native callers can link it without
# the addon. `default-members` keeps plain `cargo test` / `cargo clippy` in this
# directory covering both.
[workspace]
members = ["core"]
default-members = [".", "core"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async", "serde-json"] }
napi-derive = "3"
secret-scanner-core = { path = "core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
napi-build = "2"

# Fat LTO is a deliberate max-runtime-perf choice, not a copied default —
# measured rationale in task-runner/native/Cargo.toml (thin LTO regressed
# those hot paths and saved no build time on rustc 1.99).
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "unwind"
