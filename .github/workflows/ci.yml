name: "CI"

on: # yamllint disable-line rule:truthy
    pull_request:
        branches:
            - "main"
    push:
        branches:
            - "main"

permissions:
    actions: "read" # dawidd6 lists build-native.yml runs and downloads their artifacts
    checks: "read" # wait-for-native-build polls the Check Native Build check run
    contents: "read"

jobs:
    # build-native.yml runs on its own for every push and pull request. The test job
    # waits for its check run on this commit and downloads the host-matching bindings,
    # because the secret-scanner, task-runner, tui and vis suites load a compiled binding.
    test:
        name: "Test"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 45
        steps:
            - name: "Checkout"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  # Full history, so pnpm can compare the pull request against its base.
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  cache-prefix: "vis"
                  skip-playwright: "true"
                  upgrade-npm-version: false

            - name: "Download native build artifacts"
              uses: "./.github/actions/native-test-artifacts"
              with:
                  ref: "${{ github.event.pull_request.head.sha || github.sha }}"
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Derive appropriate SHAs for base and head for `nx affected` commands"
              id: "setSHAs"
              uses: "nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1" # v5.0.1

            - name: "Restore Nx cache"
              id: "nx-cache"
              uses: "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: ".nx/cache"
                  key: "nx-test-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}"
                  restore-keys: |
                      nx-test-${{ runner.os }}-

            # Pull requests run the suites of the packages they affect, plus their dependents.
            # Pushes to main run every suite.
            - name: "Build affected packages"
              if: "github.event_name == 'pull_request'"
              run: "pnpm run build:affected:packages"

            - name: "Build packages"
              if: "github.event_name != 'pull_request'"
              run: "pnpm run build:packages"

            - name: "Run tests"
              env:
                  # The terminal suites assert on ANSI output and fail when the runner is not a TTY.
                  FORCE_COLOR: "3"
                  EVENT: "${{ github.event_name }}"
              run: |
                  set -euo pipefail

                  if [ "$EVENT" = "pull_request" ]; then
                      pnpm run test:affected
                  else
                      pnpm run test
                  fi

            - name: "Save Nx cache"
              if: "${{ !cancelled() }}"
              uses: "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: ".nx/cache"
                  key: "${{ steps.nx-cache.outputs.cache-primary-key }}"
