name: "Lint"

on: # yamllint disable-line rule:truthy
    pull_request:
        branches:
            - "main"
    push:
        branches:
            - "main"

permissions:
    contents: "read"

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

jobs:
    ts-lint:
        name: "Lint (eslint, types, attw, package.json)"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 30
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  # Full history, so nx affected can diff against the base commit.
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  cache-prefix: "lint"
                  skip-playwright: "true"
                  upgrade-npm-version: false
                  # TODO: re-enable once pnpm/npm audit works with unpublished @visulima/task-runner-binding-* packages.
                  run-signatures-audit: false
                  run-npm-audit: false

            - name: "Derive appropriate SHAs for base and head for `nx affected` commands"
              id: "setSHAs"
              uses: "nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c" # v5.1.0

            # attw and publint check the packed output, so the affected packages are built first.
            - name: "Build affected packages"
              run: "pnpm run build:affected:packages"

            - name: "Lint eslint"
              run: "pnpm run lint:affected:eslint"

            - name: "Lint typescript types"
              run: "pnpm run lint:affected:types"

            - name: "Lint attw"
              run: "pnpm run lint:affected:attw"

            - name: "Lint package.json"
              run: "pnpm run lint:affected:package-json"

    rust-fmt:
        name: "Lint (cargo fmt)"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 15
        steps:
            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Check formatting of every native crate"
              run: |
                  set -euo pipefail
                  for manifest in \
                      packages/tooling/secret-scanner/native/Cargo.toml \
                      packages/tooling/task-runner/native/Cargo.toml \
                      packages/tooling/vis/native/Cargo.toml \
                      packages/terminal/tui/native/Cargo.toml; do
                    cargo fmt --check --manifest-path "$manifest"
                  done
