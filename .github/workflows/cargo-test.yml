# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Cargo Test"

on: # yamllint disable-line rule:truthy
    workflow_dispatch: # yamllint disable-line rule:empty-values
    pull_request:
        types: ["opened", "synchronize"]
        paths:
            - "packages/tooling/task-runner/native/**"
            - "packages/tooling/task-runner/src/concurrent*.ts"
            - "packages/tooling/task-runner/src/force-color.ts"
            - "packages/tooling/task-runner/__tests__/parity/**"
            - "packages/terminal/tui/native/**"
            - "packages/tooling/vis/native/**"
            - "packages/tooling/secret-scanner/native/**"
            - ".github/workflows/cargo-test.yml"
    push:
        branches:
            - "main"
        paths:
            - "packages/tooling/task-runner/native/**"
            - "packages/tooling/task-runner/src/concurrent*.ts"
            - "packages/tooling/task-runner/src/force-color.ts"
            - "packages/tooling/task-runner/__tests__/parity/**"
            - "packages/terminal/tui/native/**"
            - "packages/tooling/vis/native/**"
            - "packages/tooling/secret-scanner/native/**"
            - ".github/workflows/cargo-test.yml"

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}"
    cancel-in-progress: true

permissions:
    contents: "read"

env:
    CARGO_INCREMENTAL: 0

jobs:
    files-changed:
        name: "Detect Rust source changes"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 3
        # dorny/paths-filter calls the GitHub API on first run, which
        # intermittently 401s on the rotating secrets.GITHUB_TOKEN — fall back
        # to the retry step's outputs.
        outputs:
            task-runner: "${{ steps.changes.outputs.task-runner || steps.changes_retry.outputs.task-runner }}"
            tui: "${{ steps.changes.outputs.tui || steps.changes_retry.outputs.tui }}"
            vis: "${{ steps.changes.outputs.vis || steps.changes_retry.outputs.vis }}"
            secret-scanner: "${{ steps.changes.outputs.secret-scanner || steps.changes_retry.outputs.secret-scanner }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6

            - name: "Check for Rust source changes"
              uses: "dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d" # v4.0.3
              id: "changes"
              continue-on-error: true
              with:
                  token: "${{ github.token }}"
                  filters: |
                      task-runner:
                        - 'packages/tooling/task-runner/native/src/**'
                        - 'packages/tooling/task-runner/native/core/**'
                        - 'packages/tooling/task-runner/native/fspy_*/**'
                        - 'packages/tooling/task-runner/native/core/benches/**'
                        - 'packages/tooling/task-runner/native/Cargo.toml'
                        - 'packages/tooling/task-runner/native/Cargo.lock'
                        - 'packages/tooling/task-runner/src/concurrent*.ts'
                        - 'packages/tooling/task-runner/src/force-color.ts'
                        - 'packages/tooling/task-runner/__tests__/parity/**'
                      tui:
                        - 'packages/terminal/tui/native/src/**'
                        - 'packages/terminal/tui/native/Cargo.toml'
                        - 'packages/terminal/tui/native/Cargo.lock'
                      vis:
                        - 'packages/tooling/vis/native/src/**'
                        - 'packages/tooling/vis/native/cli/**'
                        - 'packages/tooling/vis/native/core/**'
                        - 'packages/tooling/task-runner/native/core/**'
                        - 'packages/tooling/secret-scanner/native/core/**'
                        - 'packages/tooling/vis/native/benches/**'
                        - 'packages/tooling/vis/native/Cargo.toml'
                        - 'packages/tooling/vis/native/Cargo.lock'
                      secret-scanner:
                        - 'packages/tooling/secret-scanner/native/src/**'
                        - 'packages/tooling/secret-scanner/native/core/**'
                        - 'packages/tooling/secret-scanner/native/Cargo.toml'
                        - 'packages/tooling/secret-scanner/native/Cargo.lock'

            - name: "Wait before retrying path filter"
              if: "steps.changes.outcome == 'failure'"
              shell: "bash"
              run: "sleep 30"

            - name: "Check for Rust source changes (retry)"
              uses: "dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d" # v4.0.3
              id: "changes_retry"
              if: "steps.changes.outcome == 'failure'"
              with:
                  token: "${{ github.token }}"
                  filters: |
                      task-runner:
                        - 'packages/tooling/task-runner/native/src/**'
                        - 'packages/tooling/task-runner/native/core/**'
                        - 'packages/tooling/task-runner/native/fspy_*/**'
                        - 'packages/tooling/task-runner/native/core/benches/**'
                        - 'packages/tooling/task-runner/native/Cargo.toml'
                        - 'packages/tooling/task-runner/native/Cargo.lock'
                        - 'packages/tooling/task-runner/src/concurrent*.ts'
                        - 'packages/tooling/task-runner/src/force-color.ts'
                        - 'packages/tooling/task-runner/__tests__/parity/**'
                      tui:
                        - 'packages/terminal/tui/native/src/**'
                        - 'packages/terminal/tui/native/Cargo.toml'
                        - 'packages/terminal/tui/native/Cargo.lock'
                      vis:
                        - 'packages/tooling/vis/native/src/**'
                        - 'packages/tooling/vis/native/cli/**'
                        - 'packages/tooling/vis/native/core/**'
                        - 'packages/tooling/task-runner/native/core/**'
                        - 'packages/tooling/secret-scanner/native/core/**'
                        - 'packages/tooling/vis/native/benches/**'
                        - 'packages/tooling/vis/native/Cargo.toml'
                        - 'packages/tooling/vis/native/Cargo.lock'
                      secret-scanner:
                        - 'packages/tooling/secret-scanner/native/src/**'
                        - 'packages/tooling/secret-scanner/native/core/**'
                        - 'packages/tooling/secret-scanner/native/Cargo.toml'
                        - 'packages/tooling/secret-scanner/native/Cargo.lock'

    test:
        name: "Test ${{ matrix.package.name }}"
        needs: "files-changed"
        if: |
            github.event_name == 'workflow_dispatch' ||
            needs.files-changed.outputs.task-runner == 'true' ||
            needs.files-changed.outputs.tui == 'true' ||
            needs.files-changed.outputs.vis == 'true' ||
            needs.files-changed.outputs.secret-scanner == 'true'
        runs-on: "ubuntu-24.04"
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                package:
                    - name: "task-runner"
                      dir: "packages/tooling/task-runner/native"
                      changed: "${{ needs.files-changed.outputs.task-runner }}"
                    - name: "tui"
                      dir: "packages/terminal/tui/native"
                      changed: "${{ needs.files-changed.outputs.tui }}"
                    - name: "vis"
                      dir: "packages/tooling/vis/native"
                      changed: "${{ needs.files-changed.outputs.vis }}"
                    - name: "secret-scanner"
                      dir: "packages/tooling/secret-scanner/native"
                      changed: "${{ needs.files-changed.outputs.secret-scanner }}"
                exclude:
                    - package:
                          changed: "false"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6

            - name: "Install Rust stable toolchain"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # v1
              with:
                  toolchain: "stable"

            - name: "Restore Cargo cache"
              id: "cargo-cache"
              uses: "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ${{ matrix.package.dir }}/target
                  key: "cargo-test-${{ matrix.package.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.package.dir)) }}"
                  restore-keys: |
                      cargo-test-${{ matrix.package.name }}-

            - name: "Run cargo test"
              working-directory: "${{ matrix.package.dir }}"
              run: "cargo test --verbose"

            # vis-cli + vis-core are workspace members alongside the addon; the
            # `cargo test` above only covers the root addon package. `-p` selects
            # just these lean crates (no oxc), so this runs on any toolchain.
            - name: "Run cargo test + clippy (vis-cli + vis-core)"
              if: "matrix.package.name == 'vis'"
              shell: "bash"
              working-directory: "packages/tooling/vis/native"
              run: |
                  cargo test -p vis-cli -p vis-core --verbose
                  cargo clippy -p vis-cli -p vis-core --all-targets -- -D warnings

            # fspy_seccomp is a path-dep of task-runner-native (not a
            # workspace member), so `cargo test` above doesn't reach
            # it. Run its tests + perf bench separately on Linux only.
            # The bench is `#[ignore]` so it requires --ignored.
            - name: "Run fspy_seccomp integration tests + perf bench"
              if: "matrix.package.name == 'task-runner' && runner.os == 'Linux'"
              shell: "bash"
              working-directory: "${{ matrix.package.dir }}/fspy_seccomp"
              run: |
                  cargo test --release --verbose
                  cargo test --test perf --release -- --ignored --nocapture

            # fspy_seccomp is outside the workspace, so the clippy step below does not
            # lint it. Its `unsafe` blocks must each carry a `// SAFETY:` comment
            # (`clippy::undocumented_unsafe_blocks`, set in its Cargo.toml).
            - name: "Run fspy_seccomp clippy"
              if: "matrix.package.name == 'task-runner' && runner.os == 'Linux'"
              shell: "bash"
              working-directory: "${{ matrix.package.dir }}/fspy_seccomp"
              run: "cargo clippy --all-targets -- -D warnings"

            - name: "Run cargo clippy"
              working-directory: "${{ matrix.package.dir }}"
              run: "cargo clippy -- -D warnings"

            # Only write the cache from trusted refs. PRs restore but never save,
            # so a fork can't poison the cache for downstream runs.
            - name: "Save Cargo cache"
              if: "github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'"
              uses: "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ${{ matrix.package.dir }}/target
                  key: "${{ steps.cargo-cache.outputs.cache-primary-key }}"

    # The concurrent runner spawns processes and signals process groups, so the
    # Linux job above says little about macOS and Windows (fork path, cmd.exe
    # quoting, Job Objects). This leg runs the concurrent runner's tests and the
    # core crate's clippy there. It is part of the required-check aggregation below, so a failure
    # on any of its legs fails "Cargo Test Status".
    # Linux joins only for the parity suite: the Rust steps already run in the Linux job
    # above, and the repo-wide test job covers only the default runner setting.
    test-core-os:
        name: "Test task-runner core (${{ matrix.os }})"
        needs: "files-changed"
        if: |
            github.event_name == 'workflow_dispatch' ||
            needs.files-changed.outputs.task-runner == 'true'
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: ["macos-latest", "windows-latest", "ubuntu-24.04"]
        steps:
            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Install Rust stable toolchain"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # v1
              with:
                  toolchain: "stable"

            # One concurrent-runner test runs `node -e ...`; both runner images ship Node.
            # Only the concurrent runner's tests: the hashing and worktree tests have
            # never run on Windows and are not what this leg is for.
            - name: "Run cargo test"
              if: "runner.os != 'Linux'"
              shell: "bash"
              working-directory: "packages/tooling/task-runner/native"
              run: "cargo test -p task-runner-core --verbose concurrent"

            - name: "Run cargo clippy"
              if: "runner.os != 'Linux'"
              shell: "bash"
              working-directory: "packages/tooling/task-runner/native"
              run: "cargo clippy -p task-runner-core --all-targets -- -D warnings"

            # The macOS and Windows tracker sources are `cfg`-gated, so only these runners
            # lint them, together with the injected library of the same platform
            # (`undocumented_unsafe_blocks` is set in each Cargo.toml).
            - name: "Run cargo clippy (native addon + fspy tracker)"
              if: "runner.os != 'Linux'"
              shell: "bash"
              working-directory: "packages/tooling/task-runner/native"
              run: |
                  cargo clippy -p task-runner-native --all-targets -- -D warnings
                  if [ "$RUNNER_OS" = "macOS" ]; then
                    cargo clippy --manifest-path fspy_macos/Cargo.toml --all-targets -- -D warnings
                  else
                    cargo clippy --manifest-path fspy_windows/Cargo.toml --all-targets -- -D warnings
                  fi

            # The behaviour suite runs the native runner on this OS: the fork path, cmd.exe quoting,
            # ConPTY and Job Objects are only exercised on macOS and Windows here, so it needs the built addon.
            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  cache-prefix: "vis"
                  skip-playwright: "true"
                  upgrade-npm-version: false
                  run-signatures-audit: false
                  run-npm-audit: false

            - name: "Build the native addon"
              shell: "bash"
              working-directory: "packages/tooling/task-runner"
              run: "pnpm build:native:debug"

            # The Ctrl+C test (__tests__/parity/concurrent-ctrl-c.test.ts) runs a mini CLI that imports the built package.
            - name: "Build the package"
              shell: "bash"
              working-directory: "packages/tooling/task-runner"
              run: "pnpm exec packem build --development"

            - name: "Run the concurrent runner suite"
              shell: "bash"
              working-directory: "packages/tooling/task-runner"
              run: "pnpm exec vitest run __tests__/parity"

    # vis-cli runs natively on Linux in the job above; Windows hands part of its surface to Node by design
    # (discovery, run keys, help), and the rest of it (paths, line endings, PATH splitting) is only checked here.
    # Part of the required-check aggregation below.
    test-vis-cli-windows:
        name: "Test vis-cli (windows-latest)"
        needs: "files-changed"
        if: |
            github.event_name == 'workflow_dispatch' ||
            needs.files-changed.outputs.vis == 'true'
        runs-on: "windows-latest"
        timeout-minutes: 30
        steps:
            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Install Rust stable toolchain"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # v1
              with:
                  toolchain: "stable"

            - name: "Run cargo test + clippy (vis-cli + vis-core)"
              shell: "bash"
              working-directory: "packages/tooling/vis/native"
              run: |
                  cargo test -p vis-cli -p vis-core --verbose
                  cargo clippy -p vis-cli -p vis-core --all-targets -- -D warnings

    # Native criterion benches tracked on CodSpeed. Separate from the JS
    # benches in codspeed.yml (those run each package's bench script under the
    # CodSpeed vitest plugin); these compile the crate's criterion benches via
    # `cargo codspeed`. The bench sources depend on `codspeed-criterion-compat`
    # (a drop-in for criterion) so the same files run instrumented here and as
    # plain `cargo bench` locally. Not part of the required-check aggregation
    # below, so a CodSpeed upload hiccup can't block merge.
    benchmark-native:
        name: "Bench native (${{ matrix.package.name }})"
        needs: "files-changed"
        if: |
            github.event_name == 'workflow_dispatch' ||
            needs.files-changed.outputs.task-runner == 'true' ||
            needs.files-changed.outputs.vis == 'true'
        runs-on: "ubuntu-24.04"
        timeout-minutes: 30
        # Scope the CodSpeed OIDC token to an environment so the same secrets /
        # reviewer rules as the JS bench job (codspeed.yml) apply to uploads.
        environment: "benchmarks"
        permissions:
            contents: "read"
            id-token: "write" # OIDC auth with CodSpeed
        strategy:
            fail-fast: false
            matrix:
                package:
                    - name: "task-runner"
                      dir: "packages/tooling/task-runner/native"
                      changed: "${{ needs.files-changed.outputs.task-runner }}"
                    - name: "vis"
                      dir: "packages/tooling/vis/native"
                      changed: "${{ needs.files-changed.outputs.vis }}"
                exclude:
                    - package:
                          changed: "false"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6

            - name: "Install Rust stable toolchain"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # v1
              with:
                  toolchain: "stable"

            - name: "Restore Cargo cache"
              id: "cargo-cache"
              uses: "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ${{ matrix.package.dir }}/target
                  key: "cargo-bench-${{ matrix.package.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.package.dir)) }}"
                  restore-keys: |
                      cargo-bench-${{ matrix.package.name }}-
                      cargo-test-${{ matrix.package.name }}-

            # `cargo codspeed` builds + runs the criterion benches with CodSpeed
            # instrumentation. Pinned to the 4.x line to match the
            # `codspeed-criterion-compat` dev-dep.
            - name: "Install cargo-codspeed"
              run: "cargo install cargo-codspeed --locked --version '^4'"

            - name: "Build benches (instrumented)"
              working-directory: "${{ matrix.package.dir }}"
              run: "cargo codspeed build"

            - name: "Run benchmarks"
              uses: "CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c" # v5.6.1
              with:
                  mode: "simulation"
                  working-directory: "${{ matrix.package.dir }}"
                  run: "cargo codspeed run"

            # Same trusted-ref rule as the test job: PRs restore but never save,
            # so a fork can't poison the bench cache for downstream runs.
            - name: "Save Cargo cache"
              if: "github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'"
              uses: "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ${{ matrix.package.dir }}/target
                  key: "${{ steps.cargo-cache.outputs.cache-primary-key }}"

    cargo-test-required-check:
        name: "Cargo Test Status"
        needs: ["files-changed", "test", "test-core-os", "test-vis-cli-windows"]
        if: "always()"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 1
        steps:
            - name: "Verify test results"
              # No untrusted input used in this step -- only workflow result values
              run: |
                  if [ "$RESULT" = "failure" ]; then
                    echo "Rust tests failed"
                    exit 1
                  fi
                  # The OS matrix (the parity suite on both runner settings) must not pass by
                  # being cancelled; a skipped job (no task-runner changes) is fine.
                  if [ "$CORE_OS_RESULT" = "failure" ] || [ "$CORE_OS_RESULT" = "cancelled" ]; then
                    echo "Task-runner core tests failed or were cancelled (macOS, Windows or Linux parity)"
                    exit 1
                  fi
                  if [ "$VIS_CLI_WINDOWS_RESULT" = "failure" ] || [ "$VIS_CLI_WINDOWS_RESULT" = "cancelled" ]; then
                    echo "vis-cli tests failed or were cancelled on Windows"
                    exit 1
                  fi
                  echo "All Rust tests passed (or skipped)"
              env:
                  RESULT: "${{ needs.test.result }}"
                  CORE_OS_RESULT: "${{ needs.test-core-os.result }}"
                  VIS_CLI_WINDOWS_RESULT: "${{ needs.test-vis-cli-windows.result }}"
