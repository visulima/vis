name: "Secret Scanner Rules Sync"

# Weekly bump of the pinned gitleaks and Kingfisher refs behind
# packages/tooling/secret-scanner/data/ruleset.json. Opens (or updates) one pull
# request with the regenerated ruleset, the rule ids added, removed or renamed,
# and the test results. Never commits to main.
#
# Two jobs, so the PAT never shares a runner with code from the lockfile or the
# upstream checkouts:
# - `build` runs the repository code (pnpm install, cargo, the sync and build
#   scripts, the tests) with a read-only GITHUB_TOKEN and no secrets, and uploads
#   the files the pull request commits plus its body.
# - `pull-request` copies those files into a fresh checkout and opens the pull
#   request with SEMANTIC_RELEASE_GITHUB_TOKEN. It runs no repository code.
#
# Both jobs block egress outside their allowlist. The Actions cache and artifact
# hosts (results-receiver.actions.githubusercontent.com and its Azure blob
# storage) are listed even though harden-runner's agent allows them implicitly,
# so the artifact hand-off doesn't depend on that default.

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: "0 6 * * 1" # Mondays 06:00 UTC
    workflow_dispatch: # yamllint disable-line rule:empty-values

permissions: {}

concurrency:
    group: "${{ github.workflow }}"
    cancel-in-progress: false

jobs:
    build:
        name: "Build secret-scanner upstream rules"
        if: "github.repository == 'visulima/vis'"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        permissions:
            contents: "read"
        outputs:
            changed: "${{ steps.refs.outputs.changed }}"
        defaults:
            run:
                working-directory: "packages/tooling/secret-scanner"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "block"
                  # github.com / api.github.com: checkout, gh api, upstream clones in build-rules and the parity test.
                  # objects / release-assets.githubusercontent.com: gh release download redirects (gitleaks CLI).
                  # raw.githubusercontent.com / nodejs.org: setup-node manifest and downloads, node-gyp headers.
                  # registry.npmjs.org: pnpm, npm, node-gyp and pnpm install.
                  # static.rust-lang.org / index.crates.io / static.crates.io: rust-toolchain.toml sync and cargo.
                  # results-receiver / *.blob.core.windows.net: Actions cache restore and the artifact upload.
                  allowed-endpoints: >
                      *.blob.core.windows.net:443
                      api.github.com:443
                      github.com:443
                      index.crates.io:443
                      nodejs.org:443
                      objects.githubusercontent.com:443
                      raw.githubusercontent.com:443
                      registry.npmjs.org:443
                      release-assets.githubusercontent.com:443
                      results-receiver.actions.githubusercontent.com:443
                      static.crates.io:443
                      static.rust-lang.org:443

            - name: "Git checkout"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  cache-prefix: "secret-scanner-rules-sync"
                  install-packages: "true"
                  # Same reasons as data-sync.yml: unpublished binding packages and jsr: deps.
                  run-npm-audit: false
                  run-signatures-audit: false

            - name: "Bump upstream refs"
              id: "refs"
              env:
                  GH_TOKEN: "${{ github.token }}"
              run: |
                  cp data/ruleset.json "$RUNNER_TEMP/ruleset.before.json"
                  node scripts/sync-upstream-refs.mjs "$RUNNER_TEMP/refs.md" >> "$GITHUB_OUTPUT"

            - name: "Build native binding and ruleset"
              if: "steps.refs.outputs.changed == 'true'"
              run: "pnpm --config.verify-deps-before-run=false run build:native:debug"

            - name: "Install gitleaks CLI for the parity test"
              if: "steps.refs.outputs.changed == 'true'"
              env:
                  GH_TOKEN: "${{ github.token }}"
              run: |
                  ref="$(sed -n 's/^ref=//p' scripts/gitleaks.ref)"
                  version="${ref#v}"
                  dir="$RUNNER_TEMP/gitleaks"
                  mkdir -p "$dir"
                  gh release download "$ref" --repo gitleaks/gitleaks --dir "$dir" \
                      --pattern "gitleaks_${version}_linux_x64.tar.gz" \
                      --pattern "gitleaks_${version}_checksums.txt"
                  (cd "$dir" && sha256sum --check --ignore-missing "gitleaks_${version}_checksums.txt")
                  tar -xzf "$dir/gitleaks_${version}_linux_x64.tar.gz" -C "$dir" gitleaks
                  echo "$dir" >> "$GITHUB_PATH"

            - name: "Run package tests"
              id: "tests"
              if: "steps.refs.outputs.changed == 'true'"
              continue-on-error: true
              run: "pnpm run test"

            - name: "Run gitleaks parity test"
              id: "parity"
              if: "steps.refs.outputs.changed == 'true'"
              continue-on-error: true
              run: "pnpm run test:parity"

            - name: "Write the shipped (minified) ruleset and the PR body"
              if: "steps.refs.outputs.changed == 'true'"
              env:
                  TESTS_OUTCOME: "${{ steps.tests.outcome }}"
                  PARITY_OUTCOME: "${{ steps.parity.outcome }}"
                  RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              run: |
                  pnpm --config.verify-deps-before-run=false run build:rules:prod
                  mkdir -p "$RUNNER_TEMP/sync"
                  {
                      echo "Automated bump of the upstream rule sources for \`@visulima/secret-scanner\`."
                      echo
                      echo "## Upstream refs"
                      echo
                      cat "$RUNNER_TEMP/refs.md"
                      echo
                      echo "## Checks"
                      echo
                      echo "- Package tests: \`$TESTS_OUTCOME\`"
                      echo "- Parity test (\`test:parity\`): \`$PARITY_OUTCOME\`"
                      echo "- Logs: $RUN_URL"
                      echo
                      echo "A rule that stops compiling fails the \`bundled ruleset compiles\` test in \`__tests__/rule-coverage.test.ts\`."
                      echo
                      echo "## Rule ids"
                      echo
                      node scripts/diff-rulesets.mjs "$RUNNER_TEMP/ruleset.before.json" data/ruleset.json
                      echo
                      echo "Review removed and renamed ids before merging: they invalidate user baselines and \`rules.exclude\` entries."
                  } > "$RUNNER_TEMP/sync/pr-body.md"

            # Same file list as the pull-request job copies and commits; paths are
            # relative to the package so the artifact layout doesn't depend on the
            # upload action's common-ancestor rule.
            - name: "Stage the pull request files"
              if: "steps.refs.outputs.changed == 'true'"
              run: |
                  mkdir -p "$RUNNER_TEMP/sync/files/scripts" "$RUNNER_TEMP/sync/files/data"
                  cp scripts/gitleaks.ref scripts/kingfisher.ref "$RUNNER_TEMP/sync/files/scripts/"
                  cp data/ruleset.json data/LICENSE-GITLEAKS data/LICENSE-KINGFISHER data/NOTICE-KINGFISHER "$RUNNER_TEMP/sync/files/data/"

            - name: "Upload the pull request files"
              if: "steps.refs.outputs.changed == 'true'"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
              with:
                  name: "secret-scanner-rules-sync"
                  path: "${{ runner.temp }}/sync"
                  if-no-files-found: "error"
                  retention-days: 1

    pull-request:
        name: "Open the secret-scanner rules sync pull request"
        needs: "build"
        if: "github.repository == 'visulima/vis' && needs.build.outputs.changed == 'true'"
        runs-on: "ubuntu-latest"
        timeout-minutes: 10
        # The pull request is pushed with SEMANTIC_RELEASE_GITHUB_TOKEN (a PAT) so
        # that CI runs on it; pull requests opened with GITHUB_TOKEN don't trigger
        # workflows. GITHUB_TOKEN itself only needs to read.
        permissions:
            contents: "read"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "block"
                  # Checkout, the artifact download, the branch push and the pull request API calls.
                  allowed-endpoints: >
                      *.blob.core.windows.net:443
                      api.github.com:443
                      github.com:443
                      results-receiver.actions.githubusercontent.com:443

            - name: "Git checkout"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  persist-credentials: false

            - name: "Download the pull request files"
              uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
              with:
                  name: "secret-scanner-rules-sync"
                  path: "${{ runner.temp }}/sync"

            # Copy a fixed list instead of the whole artifact: whatever the build job
            # ran, only these files can reach the pull request.
            - name: "Apply the pull request files"
              env:
                  SYNC_DIR: "${{ runner.temp }}/sync"
              run: |
                  test -s "$SYNC_DIR/pr-body.md"
                  for file in \
                      scripts/gitleaks.ref \
                      scripts/kingfisher.ref \
                      data/ruleset.json \
                      data/LICENSE-GITLEAKS \
                      data/LICENSE-KINGFISHER \
                      data/NOTICE-KINGFISHER; do
                      cp -- "$SYNC_DIR/files/$file" "packages/tooling/secret-scanner/$file"
                  done

            - name: "Open or update the pull request"
              uses: "peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1" # v8.1.1
              with:
                  token: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
                  branch: "chore/secret-scanner-rules-sync"
                  delete-branch: true
                  title: "chore(secret-scanner): sync upstream rule refs"
                  commit-message: "chore(secret-scanner): sync upstream rule refs"
                  body-path: "${{ runner.temp }}/sync/pr-body.md"
                  author: "github-actions-shell <github-actions[bot]@users.noreply.github.com>"
                  committer: "github-actions-shell <github-actions[bot]@users.noreply.github.com>"
                  add-paths: |
                      packages/tooling/secret-scanner/scripts/gitleaks.ref
                      packages/tooling/secret-scanner/scripts/kingfisher.ref
                      packages/tooling/secret-scanner/data/ruleset.json
                      packages/tooling/secret-scanner/data/LICENSE-GITLEAKS
                      packages/tooling/secret-scanner/data/LICENSE-KINGFISHER
                      packages/tooling/secret-scanner/data/NOTICE-KINGFISHER
