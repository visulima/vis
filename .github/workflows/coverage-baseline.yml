# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Coverage baseline"

# Codecov compares a PR against the most recent report on its BASE branch. That
# base used to come from the release job (semantic-release.yml), which tied it to
# publishing: no base when the release was skipped, blocked by `wait-for-tests`
# or cancelled by a follow-up push, and only an `affected` subset when it did
# run, with `carryforward` filling the rest from arbitrarily old reports.
#
# This workflow exists solely to give Codecov a truthful base: the FULL coverage
# suite on every push to a release branch. It is NOT a gate - nothing requires
# it, the release ignores it, and a PR's own coverage still comes from test.yml.
on: # yamllint disable-line rule:truthy
    push:
        branches:
            # Maintenance branches (semantic-release's `+([0-9])?(.{+([0-9]),x}).x`
            # extglob), in GitHub filter syntax, where `+` repeats the previous
            # character and parentheses are literal: 1.x, 1.2.x, 1.x.x.
            - "main"
    workflow_dispatch: # yamllint disable-line rule:empty-values

concurrency:
    # A release branch takes several pushes in a row (the squashed PR, then the
    # release bot's commits). Only the newest tree is worth a report, and nothing
    # here publishes, so superseded runs can be cancelled.
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    actions: "read" # to download this commit's Build Native artifacts
    checks: "read" # to poll Check Native Build via gh api
    contents: "read" # to fetch code (actions/checkout)

env:
    NX_MAX_CACHE_SIZE: "1GB"

jobs:
    coverage:
        name: "Upload coverage baseline"
        if: "github.repository == 'visulima/vis'"
        runs-on: "ubuntu-latest"
        # Up to 80 minutes waiting for Build Native (see the composite action), then
        # a full build + coverage run of the whole tree.
        timeout-minutes: 150
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main

            # Same runtime and settings as the test.yml leg that uploads PR coverage
            # (ubuntu-latest, Node 24), so the base and the PR reports are comparable.
            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  cache-prefix: "coverage"
                  skip-playwright: "true"
                  upgrade-npm-version: false
                  run-npm-audit: false
                  run-signatures-audit: false

            - name: "Native test artifacts"
              uses: "./.github/actions/native-test-artifacts"
              with:
                  ref: "${{ github.sha }}"
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            # Shares the cache family of the test.yml coverage leg: a task whose
            # inputs are unchanged restores the very coverage it produced, so only
            # what changed actually runs - while the report still covers every package.
            - name: "Build packages"
              run: "pnpm -r run build"

            # `test:coverage` over every package. A baseline must cover the whole repo,
            # not only what a single change touched.
            - name: "Run the coverage suite"
              env:
                  # The terminal suites assert on ANSI output and fail when the runner is not a TTY.
                  FORCE_COLOR: "3"
              run: "pnpm -r run test:coverage"

            - name: "Upload coverage to Codecov"
              continue-on-error: true
              uses: "./.github/actions/codecov-upload"
              with:
                  token: "${{ secrets.CODECOV_TOKEN }}"
                  run-id: "${{ github.run_id }}"
                  exclude-projects: ""
