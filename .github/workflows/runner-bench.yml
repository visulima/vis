# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Runner bench"

# Times the native concurrent runner against the JS spawner on a release addon and prints the
# table in the job summary (packages/tooling/task-runner/__bench__/concurrent-throughput.script.ts):
# echo tasks, plus the event path every `vis run` uses (output-heavy and pty tasks with an onEvent callback).
#
# Advisory: nothing here fails on a number, and it is not a required check. All three legs run on a
# pull request that touches the runner or the harness, and on a manual run (the path filter keeps
# the macOS queue for the pull requests that can change the numbers).

on: # yamllint disable-line rule:truthy
    pull_request:
        branches:
            - "main"
            - "next"
        paths:
            - "packages/tooling/task-runner/native/core/src/concurrent/**"
            - "packages/tooling/task-runner/native/core/Cargo.toml"
            - "packages/tooling/task-runner/native/Cargo.toml"
            - "packages/tooling/task-runner/native/Cargo.lock"
            - "packages/tooling/task-runner/native/src/**"
            - "packages/tooling/task-runner/src/concurrent*.ts"
            - "packages/tooling/task-runner/__bench__/concurrent-throughput.script.ts"
            - "packages/tooling/task-runner/__bench__/throughput.vitest.config.ts"
            - ".github/workflows/runner-bench.yml"
    workflow_dispatch: # yamllint disable-line rule:empty-values

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"

jobs:
    bench:
        name: "Bench (${{ matrix.os }})"
        if: "github.repository == 'visulima/vis'"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: ["ubuntu-24.04", "macos-latest", "windows-latest"]
        steps:
            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Install Rust stable toolchain"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # v1
              with:
                  toolchain: "stable"

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  node-version: "24"
                  cache-prefix: "runner-bench"
                  skip-playwright: "true"
                  upgrade-npm-version: false
                  run-signatures-audit: false
                  run-npm-audit: false

            # The same build the release uses; a debug addon spawns several times slower.
            - name: "Build the native addon (release)"
              shell: "bash"
              working-directory: "packages/tooling/task-runner"
              run: "pnpm --config.verify-deps-before-run=false build:native"

            - name: "Measure both runners"
              shell: "bash"
              working-directory: "packages/tooling/task-runner"
              env:
                  BENCH_OUT: "${{ runner.temp }}/runner-bench.json"
                  VIS_PTY_TRACE: "1"
              run: |
                  {
                      echo "### Concurrent runner: native vs JS spawner (${RUNNER_OS}, ${RUNNER_ARCH})"
                      echo
                      echo "Advisory. The bars: 200 tasks within 1.25x and one cold task within +10 ms; with onEvent set, 10 MB and 100 MB of output and 20 pty tasks each within 1.25x of the JS spawner (the three event-path rows; a row that could not run says so)."
                  } >> "$GITHUB_STEP_SUMMARY"
                  BENCH_SUMMARY="$GITHUB_STEP_SUMMARY" pnpm --config.verify-deps-before-run=false bench:concurrent

            - name: "Upload the numbers"
              if: "always()"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
              with:
                  name: "runner-bench-${{ runner.os }}"
                  path: "${{ runner.temp }}/runner-bench.json"
                  if-no-files-found: "ignore"
                  retention-days: 30
