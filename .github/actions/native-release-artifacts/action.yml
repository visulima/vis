name: "Native release artifacts"
description: >-
    Download a commit's Build Native outputs and lay them out exactly as they are
    published: the freshly generated NAPI loaders (index.js / index.d.ts) into the
    package roots, the .node binaries into their `npm/<platform>` packages (via
    `napi artifacts`), plus the sidecar files those platform packages ship (vis CLI
    binary, task-runner fspy helpers). Finally verifies that every platform package
    contains each file its package.json `files` lists, so nothing is published
    with a binary missing. Shared by semantic-release.yml and preview-release.yaml,
    so a preview package is laid out like a released one.

inputs:
    ref:
        description: "Commit whose Build Native artifacts to use (its run must have finished)."
        required: true
    github-token:
        description: "Token for the artifact download (secrets.GITHUB_TOKEN)."
        required: true
    skip-platforms:
        description: >-
            Space-separated prefixes of platform packages (the directory names under
            `npm/`, e.g. `darwin-`) that are not verified, because this commit's Build
            Native run did not build them (a pull request that cannot affect them).
            Releases and previews leave it empty, so every platform package is checked.
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        # Build Native uploads bindings for every target it built and the loaders from
        # x86_64-unknown-linux-gnu, so a missing artifact is an error, never "nothing
        # changed". It builds every target except, on a pull request into `next` that
        # does not touch macOS code, the darwin ones (see build-native.yml). `secrets.GITHUB_TOKEN` returns transient HTTP 401 mid-download on
        # multi-MB artifacts and dawidd6 doesn't retry, hence one retry.
        - name: "Download native artifacts"
          id: "download"
          continue-on-error: true
          uses: "dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309" # v28
          with:
              github_token: "${{ inputs.github-token }}"
              workflow: "build-native.yml"
              commit: "${{ inputs.ref }}"
              name: "(bindings|loader)-(.+)"
              name_is_regexp: true
              path: "artifacts"
              if_no_artifact_found: "fail"
              allow_forks: false

        - name: "Wait before retrying artifact download"
          if: "steps.download.outcome == 'failure'"
          shell: "bash"
          run: |
              rm -rf artifacts
              sleep 30

        - name: "Download native artifacts (retry)"
          if: "steps.download.outcome == 'failure'"
          uses: "dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309" # v28
          with:
              github_token: "${{ inputs.github-token }}"
              workflow: "build-native.yml"
              commit: "${{ inputs.ref }}"
              name: "(bindings|loader)-(.+)"
              name_is_regexp: true
              path: "artifacts"
              if_no_artifact_found: "fail"
              allow_forks: false

        - name: "Distribute native artifacts to platform packages"
          shell: "bash"
          env:
              SKIP_PLATFORMS: "${{ inputs.skip-platforms }}"
          run: |
              set -euo pipefail

              # Loaders: overwrite committed index.js / index.d.ts with the ones napi
              # build emitted for this commit, so the published types match the Rust
              # signatures of the .node binaries below. (The release patches the
              # version string baked into index.js later, in
              # scripts/semantic-release-native-addons.mjs.)
              for pkg in tooling/task-runner terminal/tui tooling/vis tooling/secret-scanner; do
                  name="$(basename "$pkg")"
                  cp "artifacts/loader-${name}/index.js" "packages/${pkg}/index.js"
                  cp "artifacts/loader-${name}/index.d.ts" "packages/${pkg}/index.d.ts"
              done

              # .node binaries -> npm/<platform>/. `napi artifacts` refuses to run when a configured
              # target has no binary, so a run that skips platforms (see `skip-platforms`) places the
              # files it has itself, under the name and in the directory `napi artifacts` would use
              # (`<name>-native.<platform>.node` in `npm/<platform>/`).
              for pkg in tooling/task-runner terminal/tui tooling/vis tooling/secret-scanner; do
                  name="$(basename "$pkg")"
                  find artifacts -name "${name}-native.*.node" -exec mv {} "packages/${pkg}/" \;
                  if [ -n "$SKIP_PLATFORMS" ]; then
                      for node in "packages/${pkg}/${name}-native."*.node; do
                          [ -e "$node" ] || continue
                          base="$(basename "$node" .node)"
                          platform="${base#"${name}-native."}"
                          mkdir -p "packages/${pkg}/npm/${platform}"
                          mv "$node" "packages/${pkg}/npm/${platform}/${base}.node"
                      done
                  else
                      (cd "packages/${pkg}" && pnpm exec napi artifacts --output-dir . --npm-dir npm && rm -f ./*.node)
                  fi
              done

              # Sidecars napi artifacts doesn't handle (it only distributes .node files).
              # install -m 0755 restores the exec bit the artifact round-trip drops.
              # - vis: the CLI front-end binary
              # - task-runner: the fspy helpers (seccomp helper / macOS dylib / Windows DLL)
              # Plain globs instead of `find -path`: the same step runs on Windows (git-bash),
              # where the `find` patterns matched nothing.
              shopt -s nullglob
              for f in artifacts/bindings-vis-*/npm/*/vis-native-cli* \
                  artifacts/bindings-task-runner-*/npm/*/fspy-seccomp-helper \
                  artifacts/bindings-task-runner-*/npm/*/fspy-macos.dylib \
                  artifacts/bindings-task-runner-*/npm/*/fspy-windows.dll; do
                  binding="$(basename "$(dirname "$f")")"
                  case "$f" in
                      artifacts/bindings-vis-*) dest="packages/tooling/vis/npm/${binding}" ;;
                      *) dest="packages/tooling/task-runner/npm/${binding}" ;;
                  esac
                  mkdir -p "$dest"
                  install -m 0755 "$f" "${dest}/$(basename "$f")"
              done
              shopt -u nullglob

              rm -rf artifacts/

        # npm/pnpm silently omit `files` entries that don't exist, so a platform
        # package missing its binary or sidecar would still publish - broken. Fail
        # instead.
        - name: "Verify platform packages are complete"
          shell: "bash"
          env:
              SKIP_PLATFORMS: "${{ inputs.skip-platforms }}"
          run: |
              set -euo pipefail
              shopt -s nullglob
              missing=0
              for pkg in tooling/task-runner terminal/tui tooling/vis tooling/secret-scanner; do
                  manifests=("packages/${pkg}/npm/"*/package.json)
                  # An empty glob would otherwise skip the package and report success.
                  if [ "${#manifests[@]}" -eq 0 ]; then
                      echo "::error::no platform packages found under packages/${pkg}/npm"
                      exit 1
                  fi
                  for manifest in "${manifests[@]}"; do
                      dir="$(dirname "$manifest")"
                      skip=0
                      # Unquoted on purpose: a space-separated list of plain prefixes (no globs).
                      for prefix in $SKIP_PLATFORMS; do
                          case "$(basename "$dir")" in "$prefix"*) skip=1 ;; esac
                      done
                      if [ "$skip" -eq 1 ]; then
                          echo "not verifying ${dir}: its target was not built for this commit"
                          continue
                      fi
                      # Plain assignment, so a jq failure stops the step under `set -e`.
                      # jq prints CRLF on Windows; a trailing CR would make every entry but the last look missing.
                      files="$(jq -er '.files[]' "$manifest" | tr -d '\r')"
                      while IFS= read -r file; do
                          if [ ! -e "${dir}/${file}" ]; then
                              echo "::error file=${manifest}::missing published file ${dir}/${file}"
                              missing=$((missing + 1))
                          fi
                      done <<< "$files"
                  done
              done
              if [ "$missing" -gt 0 ]; then
                  echo "${missing} file(s) missing from native platform packages"
                  exit 1
              fi
              echo "All native platform packages are complete"
